    <circle cx="36" cy="74" r="4" fill="#ff9f6b" opacity=".55"/><circle cx="84" cy="74" r="4" fill="#ff9f6b" opacity=".55"/>
    <!-- bico -->
    <path d="M55 70 L65 70 L60 79 Z" fill="#f07c12"/>
    <!-- capelo -->
    <path d="M60 18 L94 30 L60 42 L26 30 Z" fill="#0e1a12"/>
