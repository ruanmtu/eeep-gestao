<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sofia, a corujinha assistente">
  <defs>
    <radialGradient id="fundo" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#fff3e2"/><stop offset="1" stop-color="#ffd8a8"/></radialGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f9a3a"/><stop offset="1" stop-color="#0b4a20"/></linearGradient>
    <linearGradient id="barriga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f6eb"/><stop offset="1" stop-color="#c6e6c9"/></linearGradient>
    <clipPath id="circ"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#circ)">
    <rect width="120" height="120" fill="url(#fundo)"/>
    <circle cx="96" cy="22" r="22" fill="#ffffff" opacity=".45"/>
