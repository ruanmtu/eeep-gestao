    <circle cx="46" cy="60" r="14" fill="none" stroke="#f07c12" stroke-width="3"/><circle cx="74" cy="60" r="14" fill="none" stroke="#f07c12" stroke-width="3"/>
    <circle cx="48" cy="61" r="7" fill="#0e1a12"/><circle cx="72" cy="61" r="7" fill="#0e1a12"/>
    <circle cx="50.5" cy="58" r="2.4" fill="#fff"/><circle cx="74.5" cy="58" r="2.4" fill="#fff"/>
