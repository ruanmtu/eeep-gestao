    <ellipse cx="60" cy="100" rx="22" ry="22" fill="url(#barriga)"/>
    <path d="M48 94 q4 4 8 0 M56 94 q4 4 8 0 M64 94 q4 4 8 0 M52 102 q4 4 8 0 M60 102 q4 4 8 0" stroke="#5dbb63" stroke-width="2" fill="none" stroke-linecap="round"/>
