    <path d="M26 82 C18 96 22 112 34 118 C34 104 34 92 30 82 Z" fill="#0c4a1d"/>
    <path d="M94 82 C102 96 98 112 86 118 C86 104 86 92 90 82 Z" fill="#0c4a1d"/>
