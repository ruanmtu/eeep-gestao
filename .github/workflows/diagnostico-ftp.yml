# Diagnóstico manual: mostra em que pasta do FTP estão os arquivos do sistema (não altera nada)
name: Diagnóstico do FTP
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - env:
          S: ${{ secrets.FTP_SERVIDOR }}
          U: ${{ secrets.FTP_USUARIO }}
          P: ${{ secrets.FTP_SENHA }}
          D: ${{ secrets.FTP_PASTA }}
        run: |
          L() { lftp -u "$U","$P" -e "set ftp:ssl-allow no; set net:max-retries 2; $1; bye" "$S" 2>&1; }
          echo "--- /domains"; L "cls -1 /domains/" | sed 's/./& /g'
          echo "--- tipo de public_html na raiz"; L "cls -l /" | grep -i public | sed 's/./& /g'
          for d in $(L "cls -1 /domains/"); do
            echo "== $d" | sed 's/./& /g'
            L "cls -1 ${d}public_html/" | head -40 | sed 's/./& /g'
            L "cat ${d}public_html/includes/app.php" | grep -m1 SISTEMA_VERSAO
          done
          echo "== raiz public_html"; L "cat /public_html/includes/app.php" | grep -m1 SISTEMA_VERSAO
