# Diagnóstico manual: mostra em que pasta do FTP estão os arquivos do sistema (não altera nada)
name: Diagnóstico do FTP
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - env:
          S: ${{ secrets.FTP_SERVIDOR }}
          U: ${{ secrets.FTP_USUARIO }}
          P: ${{ secrets.FTP_SENHA }}
          D: ${{ secrets.FTP_PASTA }}
        run: |
          echo "FTP_PASTA = [$(echo "$D" | sed 's/./& /g')]"
          lftp -u "$U","$P" -e "set ftp:ssl-allow no; set net:max-retries 2; pwd; echo '--- raiz'; cls -1a /; echo '--- busca versao.php e app.php'; find --maxdepth=5 / | grep -E '(versao\.php|includes/app\.php|ftp-deploy-sync-state)$'; bye" "$S" 2>&1 | head -150
          for f in $(lftp -u "$U","$P" -e "set ftp:ssl-allow no; find --maxdepth=5 / | grep -E 'includes/app\.php$'; bye" "$S" 2>/dev/null); do
            echo "== $f"; lftp -u "$U","$P" -e "set ftp:ssl-allow no; cat $f; bye" "$S" 2>/dev/null | grep -m1 "SISTEMA_VERSAO"
          done
